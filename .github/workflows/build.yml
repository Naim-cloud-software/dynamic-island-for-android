name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Maak project
        run: |
          mkdir -p app/src/main/java/nl/dynamicisland
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "DynamicIsland"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          android.useAndroidX=true
          EOF_FILE
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "nl.dynamicisland"
              compileSdk = 34
              defaultConfig { applicationId = "nl.dynamicisland"; minSdk = 31; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_FILE
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.READ_PHONE_STATE"/>
              <application android:label="Dynamic Island" android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".IslandService" android:exported="false" android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="overlay"/>
                  </service>
                  <service android:name=".NotifListener" android:exported="true"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter><action android:name="android.service.notification.NotificationListenerService"/></intent-filter>
                  </service>
              </application>
          </manifest>
          EOF_FILE
          cat > app/src/main/java/nl/dynamicisland/MainActivity.kt <<'EOF_FILE'
          package nl.dynamicisland

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  val l = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(48, 120, 48, 48); gravity = Gravity.CENTER_HORIZONTAL }
                  fun btn(t: String, f: () -> Unit) = l.addView(Button(this).apply { text = t; setOnClickListener { f() } })
                  l.addView(TextView(this).apply { text = "Dynamic Island\nDoe de stappen 1 t/m 4"; textSize = 20f; setPadding(0, 0, 0, 40) })
                  btn("1. Over andere apps tekenen") {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  }
                  btn("2. Toegang tot meldingen") {
                      startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                  }
                  btn("3. Telefoon- en meldingsrechten") {
                      requestPermissions(arrayOf(Manifest.permission.READ_PHONE_STATE, Manifest.permission.POST_NOTIFICATIONS), 1)
                  }
                  btn("4. Start Dynamic Island") {
                      if (Settings.canDrawOverlays(this)) startForegroundService(Intent(this, IslandService::class.java))
                  }
                  btn("Stop") { stopService(Intent(this, IslandService::class.java)) }
                  setContentView(l)
              }
          }
          EOF_FILE
          cat > app/src/main/java/nl/dynamicisland/NotifListener.kt <<'EOF_FILE'
          package nl.dynamicisland

          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          class NotifListener : NotificationListenerService() {
              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  if (sbn.packageName == packageName || sbn.isOngoing) return
                  val n = sbn.notification
                  if (n.category == android.app.Notification.CATEGORY_TRANSPORT) return
                  val e = n.extras
                  val app = try { packageManager.getApplicationLabel(packageManager.getApplicationInfo(sbn.packageName, 0)).toString() } catch (x: Exception) { sbn.packageName }
                  val title = e.getCharSequence("android.title")?.toString() ?: app
                  val text = e.getCharSequence("android.text")?.toString() ?: ""
                  IslandService.inst?.show("$app · $title", text, n.contentIntent)
              }
          }
          EOF_FILE
          cat > app/src/main/java/nl/dynamicisland/IslandService.kt <<'EOF_FILE'
          package nl.dynamicisland

          import android.animation.ValueAnimator
          import android.app.*
          import android.content.*
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.media.session.MediaController
          import android.media.session.MediaSessionManager
          import android.media.session.PlaybackState
          import android.os.*
          import android.telephony.TelephonyCallback
          import android.telephony.TelephonyManager
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import android.widget.*

          class IslandService : Service() {
              companion object { var inst: IslandService? = null }

              private lateinit var wm: WindowManager
              private lateinit var root: LinearLayout
              private lateinit var lp: WindowManager.LayoutParams
              private lateinit var tTitle: TextView
              private lateinit var tSub: TextView
              private lateinit var controls: LinearLayout
              private val h = Handler(Looper.getMainLooper())
              private var tap: PendingIntent? = null
              private var mc: MediaController? = null
              private var temp = false
              private val collapse = Runnable { temp = false; refreshIdle() }
              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onBind(i: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate(); inst = this
                  val ch = NotificationChannel("island", "Dynamic Island", NotificationManager.IMPORTANCE_MIN)
                  getSystemService(NotificationManager::class.java).createNotificationChannel(ch)
                  val n = Notification.Builder(this, "island").setContentTitle("Dynamic Island actief")
                      .setSmallIcon(android.R.drawable.ic_menu_info_details).build()
                  if (Build.VERSION.SDK_INT >= 34) startForeground(1, n, 1073741824) else startForeground(1, n)

                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; gravity = Gravity.CENTER
                      setPadding(dp(16), dp(4), dp(16), dp(4))
                      background = GradientDrawable().apply { setColor(Color.BLACK); cornerRadius = dp(22).toFloat() }
                      setOnClickListener { onTap() }
                  }
                  tTitle = TextView(this).apply { setTextColor(Color.WHITE); textSize = 14f; setTypeface(typeface, 1); maxLines = 1; gravity = Gravity.CENTER }
                  tSub = TextView(this).apply { setTextColor(0xFFAAAAAA.toInt()); textSize = 12f; maxLines = 2; gravity = Gravity.CENTER }
                  controls = LinearLayout(this).apply { gravity = Gravity.CENTER; visibility = View.GONE }
                  fun cb(t: String, f: () -> Unit) = controls.addView(TextView(this).apply {
                      text = t; textSize = 24f; setTextColor(Color.WHITE); setPadding(dp(20), dp(4), dp(20), 0); setOnClickListener { f() } })
                  cb("⏮") { mc?.transportControls?.skipToPrevious() }
                  cb("⏯") { mc?.let { if (it.playbackState?.state == PlaybackState.STATE_PLAYING) it.transportControls.pause() else it.transportControls.play() } }
                  cb("⏭") { mc?.transportControls?.skipToNext() }
                  root.addView(tTitle); root.addView(tSub); root.addView(controls)

                  lp = WindowManager.LayoutParams(dp(110), dp(32), WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN or
                          WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL, PixelFormat.TRANSLUCENT).apply {
                      gravity = Gravity.TOP or Gravity.CENTER_HORIZONTAL; y = dp(6)
                  }
                  wm.addView(root, lp)

                  registerReceiver(object : BroadcastReceiver() {
                      override fun onReceive(c: Context, i: Intent) {
                          val b = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                          val pct = b?.let { it.getIntExtra("level", 0) * 100 / it.getIntExtra("scale", 100) } ?: 0
                          if (i.action == Intent.ACTION_POWER_CONNECTED) show("⚡ Opladen", "$pct%", null)
                      }
                  }, IntentFilter(Intent.ACTION_POWER_CONNECTED))

                  val tm = getSystemService(TelephonyManager::class.java)
                  try {
                      tm.registerTelephonyCallback(mainExecutor, object : TelephonyCallback(), TelephonyCallback.CallStateListener {
                          override fun onCallStateChanged(state: Int) {
                              if (state == TelephonyManager.CALL_STATE_RINGING) show("📞 Inkomend gesprek", "Tik om te openen", null, 30000)
                              else if (state == TelephonyManager.CALL_STATE_IDLE) { temp = false; refreshIdle() }
                          }
                      })
                  } catch (e: SecurityException) {}

                  poll.run()
              }

              private val poll = object : Runnable {
                  override fun run() {
                      try {
                          val msm = getSystemService(MediaSessionManager::class.java)
                          mc = msm.getActiveSessions(ComponentName(this@IslandService, NotifListener::class.java))
                              .firstOrNull { it.playbackState?.state == PlaybackState.STATE_PLAYING }
                      } catch (e: SecurityException) { mc = null }
                      if (!temp) refreshIdle()
                      h.postDelayed(this, 1500)
                  }
              }

              private fun refreshIdle() {
                  val m = mc
                  if (m != null) {
                      val md = m.metadata
                      tTitle.text = "♪ " + (md?.getString("android.media.metadata.TITLE") ?: "Muziek")
                      tSub.text = md?.getString("android.media.metadata.ARTIST") ?: ""
                      controls.visibility = if (expanded) View.VISIBLE else View.GONE
                      tSub.visibility = if (expanded) View.VISIBLE else View.GONE
                      size(if (expanded) dp(340) else dp(190), if (expanded) dp(110) else dp(32))
                  } else {
                      expanded = false; controls.visibility = View.GONE; tSub.visibility = View.GONE; tTitle.text = ""
                      size(dp(110), dp(32))
                  }
              }

              private var expanded = false
              private fun onTap() {
                  if (temp) { try { tap?.send() } catch (e: Exception) {}; temp = false; refreshIdle(); return }
                  if (mc != null) { expanded = !expanded; refreshIdle() }
              }

              fun show(title: String, sub: String, pi: PendingIntent?, ms: Long = 4500) {
                  h.post {
                      temp = true; tap = pi
                      tTitle.text = title; tSub.text = sub
                      tSub.visibility = View.VISIBLE; controls.visibility = View.GONE
                      size(dp(340), dp(76))
                      h.removeCallbacks(collapse); h.postDelayed(collapse, ms)
                  }
              }

              private fun size(w: Int, hh: Int) {
                  val w0 = lp.width; val h0 = lp.height
                  if (w0 == w && h0 == hh) return
                  ValueAnimator.ofFloat(0f, 1f).apply {
                      duration = 350
                      interpolator = android.view.animation.OvershootInterpolator(0.9f)
                      addUpdateListener {
                          val f = it.animatedValue as Float
                          lp.width = (w0 + (w - w0) * f).toInt(); lp.height = (h0 + (hh - h0) * f).toInt()
                          try { wm.updateViewLayout(root, lp) } catch (e: Exception) {}
                      }
                      start()
                  }
              }

              override fun onDestroy() {
                  h.removeCallbacksAndMessages(null)
                  try { wm.removeView(root) } catch (e: Exception) {}
                  inst = null; super.onDestroy()
              }
          }
          EOF_FILE
      - name: Bouw APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIsland-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create v${{ github.run_number }} app/build/outputs/apk/debug/app-debug.apk --repo ${{ github.repository }} --title "Dynamic Island" --notes "Download de APK"
